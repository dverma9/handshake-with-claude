<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your Personal AI Playbook — YouTube Creator Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap');

  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e2a;
    --bg4: #222736;
    --border: #2a2f42;
    --border2: #353c54;
    --text: #e8eaf0;
    --text2: #9aa0b8;
    --text3: #5c6380;
    --accent: #6c63ff;
    --accent2: #8b85ff;
    --accent-glow: rgba(108,99,255,0.18);
    --green: #36c98e;
    --yellow: #f0b429;
    --red: #f56565;
    --pink: #e879a0;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #f5f6fa;
    --bg2: #ffffff;
    --bg3: #eef0f7;
    --bg4: #e4e7f2;
    --border: #d1d5e8;
    --border2: #bcc2d8;
    --text: #1a1d2e;
    --text2: #4a506a;
    --text3: #8890aa;
    --accent-glow: rgba(108,99,255,0.10);
    --shadow: 0 4px 24px rgba(0,0,0,0.10);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;font-size:15px;transition:background .3s,color .3s}

  /* ── LAYOUT ── */
  .app{display:flex;height:100vh;overflow:hidden}
  .sidebar{width:230px;min-width:230px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .3s;z-index:100}
  .sidebar.collapsed{width:60px;min-width:60px}
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  .topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
  .content{padding:28px 32px;flex:1}

  /* ── SIDEBAR ── */
  .sidebar-logo{padding:18px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .logo-text{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden}
  .logo-sub{font-size:10px;color:var(--text3);font-weight:400;display:block;margin-top:1px}
  .sidebar-nav{padding:10px 8px;flex:1;overflow-y:auto}
  .nav-group{margin-bottom:6px}
  .nav-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 4px;white-space:nowrap;overflow:hidden}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;color:var(--text2);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;position:relative}
  .nav-item:hover{background:var(--bg3);color:var(--text)}
  .nav-item.active{background:var(--accent-glow);color:var(--accent2);border:1px solid rgba(108,99,255,.2)}
  .nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
  .nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;flex-shrink:0}
  .sidebar-footer{padding:10px 8px;border-top:1px solid var(--border)}
  .sidebar-toggle{width:100%;background:none;border:none;color:var(--text3);cursor:pointer;padding:8px 10px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;font-size:13px;transition:all .15s}
  .sidebar-toggle:hover{background:var(--bg3);color:var(--text)}

  /* ── TOPBAR ── */
  .topbar-title{font-size:15px;font-weight:600;color:var(--text);flex:1}
  .topbar-sub{font-size:12px;color:var(--text3)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;font-family:inherit}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
  .btn-ghost{background:none;color:var(--text2);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--bg3);color:var(--text)}
  .btn-sm{padding:5px 10px;font-size:12px}
  .btn-icon{padding:7px;background:none;border:1px solid var(--border);color:var(--text2);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;font-size:15px;display:inline-flex;align-items:center}
  .btn-icon:hover{background:var(--bg3);color:var(--text)}

  /* ── CARDS ── */
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:border-color .2s}
  .card:hover{border-color:var(--border2)}
  .card-sm{padding:14px 16px}
  .card-accent{border-left:3px solid var(--accent)}

  /* ── GRID ── */
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

  /* ── TYPOGRAPHY ── */
  .page-title{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--text);margin-bottom:4px}
  .page-sub{font-size:14px;color:var(--text2);margin-bottom:24px}
  .section-title{font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
  .label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;display:block}
  .hint{font-size:11.5px;color:var(--text3);margin-top:4px;line-height:1.5}
  h3{font-size:15px;font-weight:600;color:var(--text)}
  h4{font-size:13px;font-weight:600;color:var(--text2)}

  /* ── TAGS ── */
  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
  .tag-purple{background:rgba(108,99,255,.15);color:var(--accent2)}
  .tag-green{background:rgba(54,201,142,.12);color:var(--green)}
  .tag-yellow{background:rgba(240,180,41,.12);color:var(--yellow)}
  .tag-pink{background:rgba(232,121,160,.12);color:var(--pink)}
  .tag-red{background:rgba(245,101,101,.12);color:var(--red)}

  /* ── FORM ── */
  input,textarea,select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:13.5px;padding:9px 12px;width:100%;transition:border .15s;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:80px}
  select option{background:var(--bg2)}
  .form-row{margin-bottom:14px}

  /* ── WORKFLOW CARD ── */
  .workflow-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .2s;position:relative}
  .workflow-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 32px rgba(108,99,255,.15)}
  .workflow-card .wf-icon{font-size:24px;margin-bottom:10px}
  .workflow-card h3{font-size:14px;font-weight:600;margin-bottom:4px}
  .workflow-card p{font-size:12px;color:var(--text2);line-height:1.5}
  .workflow-card .wf-actions{display:flex;gap:6px;margin-top:12px;opacity:0;transition:opacity .2s}
  .workflow-card:hover .wf-actions{opacity:1}
  .wf-fav{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);transition:color .15s}
  .wf-fav.active{color:var(--yellow)}

  /* ── PROMPT AREA ── */
  .prompt-area{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:var(--text);min-height:160px;white-space:pre-wrap;word-break:break-word;position:relative}
  .prompt-placeholder{color:var(--text3);font-style:italic}

  /* ── BLOCK BUILDER ── */
  .block-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);transition:all .15s;margin:3px}
  .block-chip:hover{border-color:var(--accent);color:var(--accent2);background:var(--accent-glow)}
  .block-chip.added{background:var(--accent-glow);border-color:var(--accent);color:var(--accent2)}
  .block-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;position:relative}
  .block-item .block-label{font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .block-item .block-desc{font-size:11px;color:var(--text3);margin-bottom:8px;line-height:1.4}
  .block-remove{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;transition:color .15s}
  .block-remove:hover{color:var(--red)}

  /* ── TABS ── */
  .tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--radius-sm);padding:3px;margin-bottom:20px;width:fit-content}
  .tab{padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:all .15s;border:none;background:none;font-family:inherit}
  .tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.2)}

  /* ── TOAST ── */
  .toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);animation:slideIn .2s ease;max-width:280px}
  .toast.success{border-left:3px solid var(--green)}
  .toast.error{border-left:3px solid var(--red)}
  @keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes fadeOut{to{opacity:0;transform:translateX(40px)}}

  /* ── BANNER ── */
  .banner{background:linear-gradient(135deg,rgba(108,99,255,.12),rgba(232,121,160,.08));border:1px solid rgba(108,99,255,.25);border-radius:var(--radius);padding:18px 20px;margin-bottom:24px;position:relative}
  .banner-close{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px}
  .banner-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .banner-body{font-size:13px;color:var(--text2);line-height:1.6}
  .banner-sections{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .banner-sec{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}

  /* ── MODAL ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:560px;width:90%;max-height:85vh;overflow-y:auto;transform:translateY(20px);transition:transform .2s}
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal-title{font-family:'Fraunces',serif;font-size:20px;font-weight:700;margin-bottom:6px}
  .modal-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
  .modal-close{position:absolute;top:18px;right:18px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px}

  /* ── MISC ── */
  .divider{height:1px;background:var(--border);margin:20px 0}
  .flex{display:flex}
  .items-center{align-items:center}
  .justify-between{justify-content:space-between}
  .gap-8{gap:8px}
  .gap-12{gap:12px}
  .mt-8{margin-top:8px}
  .mt-16{margin-top:16px}
  .mt-24{margin-top:24px}
  .mb-16{margin-bottom:16px}
  .hidden{display:none!important}
  .mono{font-family:'JetBrains Mono',monospace;font-size:12px}
  .chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--bg4);color:var(--text2)}
  .progress{height:5px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:6px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:99px;transition:width .4s}
  .search-bar{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px}
  .search-bar input{border:none;background:none;padding:8px 0}
  .kbd{display:inline-block;padding:1px 5px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3)}
  .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
  .stat-num{font-family:'Fraunces',serif;font-size:32px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .stat-label{font-size:12px;color:var(--text2);margin-top:2px}
  .help-btn{position:fixed;bottom:24px;left:24px;width:40px;height:40px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text2);box-shadow:var(--shadow);z-index:100;transition:all .15s}
  .help-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .empty-state{text-align:center;padding:48px 24px;color:var(--text3)}
  .empty-state .es-icon{font-size:40px;margin-bottom:12px}
  .empty-state p{font-size:13px;line-height:1.6}
  .loop-step{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px}
  .loop-step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  code{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:var(--bg3);padding:1px 5px;border-radius:4px;color:var(--accent2)}
  @media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}.sidebar{position:fixed;left:-230px;height:100%;transition:left .3s}.sidebar.mobile-open{left:0}.content{padding:16px}}
</style>
</head>
<body>

<div class="app">
<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">🎬</div>
    <div class="logo-text" id="sidebarLogoText">
      AI Playbook
      <span class="logo-sub">YouTube Creator</span>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-group">
      <div class="nav-label" id="nlMain">Main</div>
      <div class="nav-item active" data-page="dashboard" onclick="goPage('dashboard',this)">
        <span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span>
      </div>
      <div class="nav-item" data-page="workflows" onclick="goPage('workflows',this)">
        <span class="nav-icon">⚡</span><span class="nav-text">Workflows</span>
        <span class="nav-badge nav-text">12</span>
      </div>
      <div class="nav-item" data-page="favorites" onclick="goPage('favorites',this)">
        <span class="nav-icon">⭐</span><span class="nav-text">Favorites</span>
      </div>
    </div>
    <div class="nav-group">
      <div class="nav-label" id="nlBuild">Build</div>
      <div class="nav-item" data-page="prompt-builder" onclick="goPage('prompt-builder',this)">
        <span class="nav-icon">🧩</span><span class="nav-text">Prompt Builder</span>
      </div>
      <div class="nav-item" data-page="loop-builder" onclick="goPage('loop-builder',this)">
        <span class="nav-icon">🔁</span><span class="nav-text">Loop Builder</span>
      </div>
      <div class="nav-item" data-page="my-workflows" onclick="goPage('my-workflows',this)">
        <span class="nav-icon">📁</span><span class="nav-text">My Workflows</span>
      </div>
    </div>
    <div class="nav-group">
      <div class="nav-label" id="nlTools">Tools</div>
      <div class="nav-item" data-page="settings" onclick="goPage('settings',this)">
        <span class="nav-icon">⚙️</span><span class="nav-text">Settings</span>
      </div>
    </div>
  </nav>
  <div class="sidebar-footer">
    <button class="sidebar-toggle" onclick="toggleSidebar()">
      <span id="toggleIcon">◀</span><span id="toggleText" class="nav-text"> Collapse</span>
    </button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <button class="btn-icon" id="mobileMenuBtn" onclick="toggleMobileSidebar()" style="display:none">☰</button>
    <div>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-sub" id="topbarSub">Your personalized AI workflow system for YouTube Educational content</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <button class="btn-icon" id="themeBtn" onclick="toggleTheme()" title="Toggle light/dark mode">🌙</button>
      <button class="btn btn-ghost btn-sm" onclick="exportData()">⬇ Export</button>
      <button class="btn btn-primary btn-sm" onclick="goPage('my-workflows');showNewWorkflowModal()">+ New Workflow</button>
    </div>
  </div>

  <div class="content" id="mainContent">
    <!-- Content injected by JS -->
  </div>
</main>
</div>

<!-- HELP BTN -->
<button class="help-btn" onclick="showHelp()" title="What is this?">?</button>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- MODAL OVERLAY -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <button class="modal-close" onclick="closeModalNow()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const PROFILE = {
  role: 'Content Creator / Writer',
  platform: 'YouTube',
  niche: 'Educational / Explainer',
  experience: 'Intermediate',
  useCases: ['Video Ideas','Scripts','Titles & Thumbnails','Descriptions & SEO','Repurposing Content']
};

const WORKFLOWS = [
  {
    id:'wf1', icon:'💡', category:'Ideation',
    title:'Viral Topic Generator',
    desc:'Turn a broad subject into 10 research-backed, search-optimized video ideas ranked by potential.',
    tags:['ideation','SEO','research'],
    template:`You are a YouTube growth strategist specializing in educational content.

My channel: Educational / Explainer videos
Niche focus: [YOUR_NICHE_HERE e.g. "personal productivity", "science", "history"]
Target audience: [AUDIENCE e.g. "beginners curious about X"]

Generate 10 YouTube video ideas that:
- Target high search intent (people actively looking for this)
- Have strong "curiosity gap" titles
- Are feasible to explain in 8–15 minutes
- Build on each other to encourage binge-watching

For each idea, provide:
1. Title (clickable, uses power words)
2. Search angle (what keyword intent it targets)
3. Hook angle (first 30 seconds premise)
4. Why now (trending or evergreen?)

Format as a numbered list. Sort by estimated viewer demand, highest first.`,
    variables:['YOUR_NICHE_HERE','AUDIENCE']
  },
  {
    id:'wf2', icon:'📝', category:'Scripting',
    title:'Full Video Script Writer',
    desc:'Generate a complete, engaging educational script with hook, body, and CTA.',
    tags:['script','writing','educational'],
    template:`You are an expert educational YouTube scriptwriter. Your scripts convert complex ideas into clear, engaging content that keeps viewers watching.

Video title: [VIDEO_TITLE]
Core concept to explain: [CONCEPT]
Target audience: [AUDIENCE e.g. "complete beginners", "intermediate learners"]
Target length: [LENGTH e.g. "10-12 minutes (~1500 words spoken"]
Tone: [TONE e.g. "conversational but authoritative, like a smart friend explaining"]

Write a full YouTube script with:

**HOOK (0:00–0:30)** — Open with a surprising fact, bold claim, or relatable problem. Do NOT start with "Hey guys."

**INTRO (0:30–1:30)** — State what they'll learn and why it matters to them specifically.

**BODY** — Break into 3–5 clear sections. Each section:
- Has a clear title/transition phrase
- Uses analogies and real-world examples
- Includes a [B-ROLL suggestion] in brackets

**RETENTION LOOPS** — Add 2 "coming up" teases to reduce drop-off.

**OUTRO (last 60s)** — Recap, insight payoff, and soft CTA to subscribe/watch next.

Add [PAUSE] markers where pacing should slow. Add [EMPHASIS] for key lines.`,
    variables:['VIDEO_TITLE','CONCEPT','AUDIENCE','LENGTH','TONE']
  },
  {

function goPage(page, el) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  else {
    const found = document.querySelector(`.nav-item[data-page="${page}"]`);
    if(found) found.classList.add('active');
  }
  const meta = PAGE_META[page]||{title:page,sub:''};
  document.getElementById('topbarTitle').textContent = meta.title;
  document.getElementById('topbarSub').textContent = meta.sub;
  renderPage();
}

function renderPage(){
  const c = document.getElementById('mainContent');
  c.innerHTML = '';
  const fns = {
    'dashboard':renderDashboard,
    'workflows':renderWorkflows,
    'favorites':renderFavorites,
    'prompt-builder':renderPromptBuilder,
    'loop-builder':renderLoopBuilder,
    'my-workflows':renderMyWorkflows,
    'settings':renderSettings
  };
  (fns[currentPage]||renderDashboard)(c);
}

function openWorkflow(id){

    <label class="label">${v.replace(/_/g,' ')}</label>
    <input type="text" placeholder="Enter ${v.replace(/_/g,' ').toLowerCase()}" data-var="${v}" oninput="updateVar('${id}','${v}',this.value)">

  </div>

  <div class="section-title">Prompt Template</div>
  <div class="prompt-area" id="wfPromptPreview" style="max-height:280px;overflow-y:auto">${escHtml(renderPreview())}</div>

    <button class="btn btn-ghost" onclick="duplicateWorkflow('${id}');closeModalNow()">Duplicate to My Workflows</button>
    <button class="btn btn-ghost" style="margin-left:auto;color:var(--text3)" onclick="toggleFav('${id}')">★ ${favorites.includes(id)?'Unfavorite':'Favorite'}</button>
  </div>`;

let _activeVarWfId = null;
let _activeVars = {};

function updateVar(id,varName,val){
  _activeVarWfId = id;
  if(!_activeVars[id]) _activeVars[id]={};
  _activeVars[id][varName]=val;
  const wf = [...WORKFLOWS,...myWorkflows].find(w=>w.id===id);
  if(!wf) return;
  let t = wf.template;
  (wf.variables||[]).forEach(v=>{
    const v2 = (_activeVars[id]||{})[v]||'';
    t = t.replaceAll('['+v+']', v2||('['+v+']'));
  });
  const el = document.getElementById('wfPromptPreview');
  if(el) el.textContent = t;
}

function copyPrompt(id){
  const wf = [...WORKFLOWS,...myWorkflows].find(w=>w.id===id);
  if(!wf) return;
  let t = wf.template;
  (wf.variables||[]).forEach(v=>{
    const val = (_activeVars[id]||{})[v]||('['+ v +']');
    t = t.replaceAll('['+v+']', val);
  });
  navigator.clipboard.writeText(t).then(()=>toast('Prompt copied to clipboard!','success'));
}

function duplicateWorkflow(id){
  const wf = [...WORKFLOWS,...myWorkflows].find(w=>w.id===id);
  if(!wf) return;
  const newWf = {...wf, id:'my_'+Date.now(), title: wf.title+' (copy)'};
  myWorkflows.push(newWf);
  saveMyWorkflows();
  toast('Duplicated to My Workflows!','success');
}

function toggleFav(id){
  if(favorites.includes(id)){
    favorites = favorites.filter(f=>f!==id);
  } else {
    favorites.push(id);
  }
  localStorage.setItem('pb_favorites',JSON.stringify(favorites));
  // update star UI
  document.querySelectorAll('.wf-fav').forEach(btn=>{
    const cardId = btn.closest('.workflow-card')?.id?.replace('wfc-','');
    if(cardId===id){
      btn.classList.toggle('active', favorites.includes(id));
    }
  });
  // update stat
  const sn = document.querySelectorAll('.stat-num');
  if(sn[1]) sn[1].textContent = favorites.length;
}

function blockItemHTML(b,i){
  const def = BLOCK_DEFS[b.key];
  return `
  <div class="block-item" id="bi-${i}">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <span style="font-size:14px">${def.icon}</span>
      <div class="block-label">${def.label}</div>
    </div>
    <div class="block-desc">${def.desc}</div>
    <select onchange="updateBlock(${i},this.value)" style="margin-bottom:6px">
      <option value="">— Select a preset or type your own —</option>
      ${def.options.map(o=>`<option value="${o}" ${b.value===o?'selected':''}>${o}</option>`).join('')}
    </select>
    <input type="text" placeholder="Or type your own ${def.label.toLowerCase()}…" value="${b.custom||''}" oninput="updateBlockCustom(${i},this.value)">
    <button class="block-remove" onclick="removeBlock(${i})">✕</button>
  </div>`;
}

function addBlock(key){
  if(builderBlocks.find(b=>b.key===key)) return; // already added
  builderBlocks.push({key,value:'',custom:''});
  renderPage();
}

function removeBlock(i){
  builderBlocks.splice(i,1);
  renderPage();
}

function updateBlock(i,val){
  builderBlocks[i].value=val;
  builderBlocks[i].custom='';
  refreshBuilderPreview();
}

function updateBlockCustom(i,val){
  builderBlocks[i].custom=val;
  builderBlocks[i].value='';
  refreshBuilderPreview();
}

function refreshBuilderPreview(){
  const el = document.getElementById('builderPreview');
  if(el) el.textContent = buildPromptText()||'';
}

function buildPromptText(){
  if(!builderBlocks.length) return '';
  return builderBlocks.map(b=>{
    const def = BLOCK_DEFS[b.key];
    const val = b.custom||b.value;
    if(!val) return `[${def.label.toUpperCase()} — not filled yet]`;
    const prefixes={role:'You are a',objective:'Your task is to',context:'Context:',constraints:'Constraints:',reasoning:'Approach:',format:'Output format:',tone:'Tone:',examples:'Example:',quality:'Before finalizing:'};
    return `${prefixes[b.key]||def.label+':'} ${val}`;
  }).join('\n\n');
}

function copyBuilderPrompt(){
  const t = buildPromptText();
  if(!t){toast('Add some blocks first!','error');return;}
  navigator.clipboard.writeText(t).then(()=>toast('Prompt copied!','success'));
}

function clearBuilder(){
  builderBlocks=[];

}

function saveBuilderAsWorkflow(){

    desc:'Built with Prompt Builder',

    template:t,
    variables:[]
  };
  myWorkflows.push(wf);
  saveMyWorkflows();
  toast('Saved to My Workflows!','success');
}

function updateLoopPreview(){
  const get = id=>{ const el=document.getElementById(id); return el?el.value:''; };
  loopData = {
    base:get('loopBase'), goal:get('loopGoal'),
    eval:get('loopEval'), improv:get('loopImprov'),
    stop:get('loopStop'), safety:get('loopSafety')
  };
  const el = document.getElementById('loopPreview');
  if(!el) return;
  const parts = [];
  if(loopData.base) parts.push('## TASK\n'+loopData.base);
  if(loopData.goal) parts.push('## GOAL\nYour goal is to produce output where: '+loopData.goal);
  if(loopData.eval) parts.push('## HOW TO EVALUATE\nAfter each response, score the output using these criteria:\n'+loopData.eval);
  if(loopData.improv) parts.push('## HOW TO IMPROVE\nIf the output does not meet the goal:\n'+loopData.improv);
  if(loopData.stop) parts.push('## WHEN TO STOP\n'+loopData.stop+'\n\nWhen stopping, output a final summary showing: (a) the final result, (b) what changed across iterations, (c) final scores.');
  if(loopData.safety) parts.push('## SAFETY RULES\n'+loopData.safety);
  if(parts.length){
    parts.push('## START\nBegin with the task. After your first response, immediately evaluate it, improve it if needed, and continue until the stop condition is met. Show your work at each step.');
    el.textContent = parts.join('\n\n');
  } else {
    el.innerHTML = '<span class="prompt-placeholder">Fill in the fields to build your loop prompt…</span>';
  }
}

function copyLoopPrompt(){
  const el = document.getElementById('loopPreview');

  navigator.clipboard.writeText(el.textContent).then(()=>toast('Loop prompt copied!','success'));
}

    template:el.textContent, variables:[]
  };
  myWorkflows.push(wf);

  toast('Saved to My Workflows!','success');
}

  <div class="form-row">
    <label class="label">Prompt Template</label>
    <div class="hint" style="margin-bottom:6px">Use [VARIABLE_NAME] for parts the user should fill in each time.</div>
    <textarea id="nwTemplate" rows="8" placeholder="You are a [ROLE]...&#10;&#10;My video topic: [TOPIC]&#10;&#10;Please..."></textarea>
  </div>
  <div style="display:flex;gap:8px;margin-top:6px">
    <button class="btn btn-primary" onclick="saveNewWorkflow()">Save Workflow</button>
    <button class="btn btn-ghost" onclick="closeModalNow()">Cancel</button>
  </div>`;
  openModal();
}

function editMyWorkflow(id){
  const wf = myWorkflows.find(w=>w.id===id);
  if(!wf) return;
  editingWfId = id;
  document.getElementById('modalContent').innerHTML = `
  <div class="modal-title">Edit Workflow</div>
  <div class="modal-sub">Changes are saved locally in your browser.</div>
  <div class="form-row"><label class="label">Title</label><input id="nwTitle" type="text" value="${escHtml(wf.title)}"></div>
  <div class="form-row"><label class="label">Description</label><input id="nwDesc" type="text" value="${escHtml(wf.desc||'')}"></div>
  <div class="form-row">
    <label class="label">Category</label>
    <select id="nwCat">
      ${['Ideation','Scripting','Titles & Thumbnails','SEO & Descriptions','Repurposing','Research','Engagement','Custom'].map(c=>`<option ${c===wf.category?'selected':''}>${c}</option>`).join('')}
    </select>
  </div>
  <div class="form-row"><label class="label">Icon (emoji)</label><input id="nwIcon" type="text" value="${wf.icon||'📝'}" style="max-width:80px"></div>
  <div class="form-row">
    <label class="label">Prompt Template</label>
    <textarea id="nwTemplate" rows="8">${escHtml(wf.template)}</textarea>
  </div>
  <div style="display:flex;gap:8px;margin-top:6px">
    <button class="btn btn-primary" onclick="saveNewWorkflow()">Save Changes</button>
    <button class="btn btn-ghost" onclick="closeModalNow()">Cancel</button>
  </div>`;
  openModal();
}

function saveNewWorkflow(){
  const title = document.getElementById('nwTitle')?.value?.trim();
  const template = document.getElementById('nwTemplate')?.value?.trim();
  if(!title||!template){toast('Title and template are required.','error');return;}
  const vars = (template.match(/\[([A-Z_]+)\]/g)||[]).map(v=>v.slice(1,-1));
  if(editingWfId){
    const idx = myWorkflows.findIndex(w=>w.id===editingWfId);
    if(idx>-1){
      myWorkflows[idx] = {...myWorkflows[idx],
        title, desc:document.getElementById('nwDesc')?.value||'',
        category:document.getElementById('nwCat')?.value||'Custom',
        icon:document.getElementById('nwIcon')?.value||'📝',
        template, variables:vars
      };
    }
    toast('Workflow updated!','success');
  } else {
    myWorkflows.push({
      id:'my_'+Date.now(),
      icon:document.getElementById('nwIcon')?.value||'📝',
      category:document.getElementById('nwCat')?.value||'Custom',
      title, desc:document.getElementById('nwDesc')?.value||'',
      tags:['custom'], template, variables:vars
    });
    toast('Workflow saved!','success');
  }
  saveMyWorkflows();
  closeModalNow();
  renderPage();
}

function deleteMyWorkflow(id){
  if(!confirm('Delete this workflow? This cannot be undone.')) return;
  myWorkflows = myWorkflows.filter(w=>w.id!==id);
  saveMyWorkflows();
  toast('Workflow deleted.','success');
  renderPage();
}

function saveMyWorkflows(){
  localStorage.setItem('pb_my_workflows',JSON.stringify(myWorkflows));
  // update stat
  const sn = document.querySelectorAll('.stat-num');
  if(sn[2]) sn[2].textContent = myWorkflows.length;
}

// SETTINGS
// ═══════════════════════════════════════════

  <div class="grid-2" style="gap:20px">

          <div style="font-size:40px">🎬</div>

        <div class="divider"></div>

        <div class="divider"></div>
        <h4 style="margin-bottom:6px">Import Data</h4>

        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">

          ['⌘ + N','New workflow'],

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function escHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg,type='success'){
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span>${type==='success'?'✅':'❌'}</span>${msg}`;
  c.appendChild(t);
  setTimeout(()=>{t.style.animation='fadeOut .3s ease forwards';setTimeout(()=>t.remove(),300)},2500);
}

function openModal(){
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e){
  if(e.target===document.getElementById('modalOverlay')) closeModalNow();
}

function closeModalNow(){
  document.getElementById('modalOverlay').classList.remove('open');
}

function toggleTheme(){
  const curr = document.documentElement.getAttribute('data-theme');
  const next = curr==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('themeBtn').textContent = next==='dark'?'🌙':'☀️';
  localStorage.setItem('pb_theme',next);
}

function toggleSidebar(){
  sidebarCollapsed = !sidebarCollapsed;
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('collapsed',sidebarCollapsed);
  document.getElementById('toggleIcon').textContent = sidebarCollapsed?'▶':'◀';
  ['sidebarLogoText','toggleText','nlMain','nlBuild','nlTools'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display=sidebarCollapsed?'none':'';
  });
  document.querySelectorAll('.nav-text,.nav-badge').forEach(el=>{
    el.style.display=sidebarCollapsed?'none':'';
  });
}

function toggleMobileSidebar(){
  document.getElementById('sidebar').classList.toggle('mobile-open');
}

function dismissBanner(){
  bannerDismissed=true;
  localStorage.setItem('pb_banner','true');
  const b=document.getElementById('mainBanner');
  if(b) b.style.display='none';
}

function showHelp(){
  document.getElementById('modalContent').innerHTML = `
  <div class="modal-title">What is this tool?</div>
  <div class="modal-sub">Your Personal AI Playbook — YouTube Creator Edition</div>
  <div style="font-size:13.5px;color:var(--text2);line-height:1.7">
    <p>This is a library of reusable AI workflow systems built specifically for your YouTube Educational channel. It helps you get consistent, high-quality AI outputs — not by giving you random prompts, but by giving you <strong style="color:var(--text)">structured systems</strong> that match how you actually work.</p>
    <div class="divider"></div>
    <div style="display:grid;gap:12px">
      <div><strong style="color:var(--text)">⚡ Workflows Library</strong><br>12 ready-to-use AI prompt templates covering every stage: ideation → research → scripting → titles → SEO → repurposing. Click any card, fill in your variables, and copy.</div>
      <div><strong style="color:var(--text)">🧩 Prompt Builder</strong><br>Assemble a custom prompt from modular building blocks (Role, Objective, Context, Format, etc.). Each block has a plain-English explanation. Mix and match to create prompts tailored to any task.</div>
      <div><strong style="color:var(--text)">🔁 Loop Builder</strong><br>Convert any prompt into a self-improving loop. The AI completes the task, evaluates it against your criteria, improves it, and repeats until your stop condition is met.</div>
      <div><strong style="color:var(--text)">📁 My Workflows</strong><br>Create, edit, and save your own workflow systems. Everything is stored locally in your browser — nothing is sent to any server.</div>
    </div>
    <div class="divider"></div>
    <p><strong style="color:var(--text)">Everything lives in this one HTML file.</strong> Bookmark it, save it to your desktop, and it works offline.</p>
  </div>
  <button class="btn btn-primary" style="margin-top:16px" onclick="closeModalNow()">Got it, let's go!</button>`;
  openModal();
}

function exportData(){
  const data = {favorites, myWorkflows, exportedAt: new Date().toISOString(), version:'1.0'};
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ai-playbook-backup.json';
  a.click();
  toast('Data exported!','success');
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(data.favorites) favorites = data.favorites;
      if(data.myWorkflows) myWorkflows = data.myWorkflows;
      localStorage.setItem('pb_favorites',JSON.stringify(favorites));
      saveMyWorkflows();
      toast('Data imported!','success');
      renderPage();
    }catch{toast('Invalid file format.','error');}
  };
  reader.readAsText(file);
}

function resetData(){
  if(!confirm('Reset all your custom workflows and favorites? This cannot be undone.')) return;
  favorites=[];
  myWorkflows=[];
  localStorage.removeItem('pb_favorites');
  localStorage.removeItem('pb_my_workflows');
  toast('Data reset.','success');
  renderPage();
}

// ═══════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModalNow();
  if(e.key==='?' && !e.target.matches('input,textarea')) showHelp();
  if((e.metaKey||e.ctrlKey)&&e.key==='e'){e.preventDefault();exportData();}
  if((e.metaKey||e.ctrlKey)&&e.key==='n'){e.preventDefault();goPage('my-workflows');showNewWorkflowModal();}
});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
(function init(){
  const theme = localStorage.getItem('pb_theme')||'dark';
  document.documentElement.setAttribute('data-theme',theme);
  document.getElementById('themeBtn').textContent = theme==='dark'?'🌙':'☀️';
  // mobile detection
  if(window.innerWidth<768){
    document.getElementById('mobileMenuBtn').style.display='flex';
    document.getElementById('sidebar').classList.add('collapsed');
    sidebarCollapsed=true;
  }
  renderPage();
})();
</script>

</html>
