<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Think Like a Marketing Strategist</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3e;
    --accent: #7c6af7;
    --accent2: #f76ab7;
    --accent3: #6af7c8;
    --text: #e8e8f0;
    --muted: #8888a8;
    --warn: #f7c26a;
    --font: 'Space Grotesk', sans-serif;
    --mono: 'Space Mono', monospace;
  }

  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  #root { min-height: 100vh; }

  .app { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }

  /* PROGRESS */
  .progress-bar { display: flex; gap: 6px; margin-bottom: 32px; align-items: center; }
  .progress-step { height: 4px; flex: 1; border-radius: 4px; background: var(--border); transition: background 0.4s; }
  .progress-step.done { background: var(--accent); }
  .progress-step.active { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .progress-label { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; margin-left: 8px; }

  /* CARDS */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; margin-bottom: 20px; transition: border-color 0.2s; }
  .card:hover { border-color: #3a3a5e; }
  .card.accent-border { border-color: var(--accent); }
  .card.glow { box-shadow: 0 0 32px rgba(124,106,247,0.12); }

  /* TYPOGRAPHY */
  h1 { font-size: clamp(28px, 5vw, 48px); font-weight: 700; line-height: 1.1; }
  h2 { font-size: clamp(20px, 3vw, 28px); font-weight: 600; margin-bottom: 8px; }
  h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  p { color: var(--muted); line-height: 1.7; font-size: 15px; }
  .label { font-size: 11px; font-family: var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; display: block; }
  .highlight { color: var(--accent); }
  .highlight2 { color: var(--accent2); }
  .highlight3 { color: var(--accent3); }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 10px; font-family: var(--font); font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #9180ff; transform: translateY(-1px); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-outline { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn-outline:hover { background: rgba(124,106,247,0.1); }
  .btn-warn { background: rgba(247,194,106,0.12); color: var(--warn); border: 1px solid rgba(247,194,106,0.3); }
  .btn-warn:hover { background: rgba(247,194,106,0.2); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* CHOICE CARDS */
  .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .choice-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 24px; cursor: pointer; transition: all 0.2s; text-align: left; }
  .choice-card:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-2px); }
  .choice-card.selected { border-color: var(--accent); background: rgba(124,106,247,0.08); }
  .choice-card .emoji { font-size: 32px; margin-bottom: 12px; display: block; }
  .choice-card h3 { color: var(--text); font-size: 15px; }
  .choice-card p { font-size: 13px; margin-top: 4px; }

  /* PLATFORM CARDS */
  .platform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }
  .platform-card { border: 1.5px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; background: var(--surface); }
  .platform-card:hover { border-color: var(--accent); }
  .platform-card.selected { border-color: var(--accent); background: rgba(124,106,247,0.08); }
  .platform-card.not-recommended { border-color: transparent; background: var(--surface2); opacity: 0.6; }
  .platform-card .plat-icon { font-size: 24px; margin-bottom: 8px; }
  .platform-card h3 { font-size: 13px; color: var(--text); }
  .platform-card .fit-badge { font-size: 10px; font-family: var(--mono); padding: 2px 6px; border-radius: 4px; margin-top: 6px; display: inline-block; }
  .fit-high { background: rgba(106,247,200,0.15); color: var(--accent3); }
  .fit-med { background: rgba(247,194,106,0.15); color: var(--warn); }
  .fit-low { background: rgba(255,100,100,0.15); color: #ff6464; }

  /* PILLAR CARDS */
  .pillar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin: 16px 0; }
  .pillar-card { border: 1.5px solid var(--border); border-radius: 12px; padding: 18px; cursor: pointer; transition: all 0.2s; background: var(--surface); position: relative; overflow: hidden; }
  .pillar-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.2s; }
  .pillar-card.selected::before { opacity: 1; }
  .pillar-card:hover { border-color: var(--accent); }
  .pillar-card.selected { border-color: var(--accent); background: rgba(124,106,247,0.07); }
  .pillar-card.maxed { opacity: 0.5; cursor: not-allowed; }
  .pillar-card h3 { font-size: 14px; color: var(--text); }
  .pillar-card p { font-size: 12px; margin-top: 6px; }

  /* ROADMAP */
  .roadmap-week { background: var(--surface2); border-radius: 12px; padding: 20px; margin-bottom: 12px; border-left: 3px solid var(--accent); }
  .roadmap-week h3 { color: var(--accent); font-size: 13px; font-family: var(--mono); }
  .roadmap-week .week-theme { font-size: 16px; font-weight: 600; color: var(--text); margin: 6px 0 4px; }
  .roadmap-week p { font-size: 13px; }
  .goal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 11px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; color: var(--muted); font-family: var(--mono); }

  /* CLAUDE PROMPT CARD */
  .prompt-card { background: rgba(124,106,247,0.06); border: 1px dashed rgba(124,106,247,0.4); border-radius: 14px; padding: 22px; margin: 20px 0; }
  .prompt-card .prompt-label { font-size: 11px; font-family: var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .prompt-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; font-family: var(--mono); font-size: 12px; color: var(--text); line-height: 1.8; margin: 10px 0; white-space: pre-wrap; }
  .prompt-card p { font-size: 13px; }

  /* EVENT CARD */
  .event-card { background: linear-gradient(135deg, rgba(247,106,183,0.08), rgba(124,106,247,0.08)); border: 1.5px solid rgba(247,106,183,0.3); border-radius: 16px; padding: 28px; }
  .event-title { font-size: 22px; font-weight: 700; color: var(--accent2); margin: 12px 0 8px; }

  /* REPORT */
  .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0; }
  @media (max-width: 560px) { .report-grid { grid-template-columns: 1fr; } }
  .report-item { background: var(--surface2); border-radius: 12px; padding: 18px; }
  .report-item h3 { font-size: 12px; font-family: var(--mono); color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
  .report-item p { font-size: 14px; color: var(--text); line-height: 1.6; }
  .score-bar { height: 6px; border-radius: 3px; background: var(--border); margin: 8px 0; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent3)); transition: width 1s ease; }

  /* LESSON CARDS */
  .lesson-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; gap: 14px; align-items: flex-start; }
  .lesson-num { font-size: 32px; font-weight: 700; font-family: var(--mono); color: var(--accent); opacity: 0.4; line-height: 1; min-width: 36px; }

  /* TEXTAREA + INPUT */
  textarea, input[type="text"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-family: var(--font); font-size: 15px; color: var(--text); resize: vertical; outline: none; transition: border-color 0.2s; }
  textarea:focus, input[type="text"]:focus { border-color: var(--accent); }

  /* DIVIDER */
  .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* FADE IN */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeUp 0.4s ease forwards; }

  /* WELCOME HERO */
  .hero-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(124,106,247,0.12); border: 1px solid rgba(124,106,247,0.3); border-radius: 100px; padding: 6px 14px; font-size: 12px; font-family: var(--mono); color: var(--accent); margin-bottom: 24px; }
  .hero-subtitle { font-size: 17px; color: var(--muted); max-width: 520px; line-height: 1.7; margin: 16px 0 32px; }
  .feature-list { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
  .feature-item { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
  .feature-item span:first-child { font-size: 18px; }

  /* INFO BOX */
  .info-box { background: rgba(106,247,200,0.06); border: 1px solid rgba(106,247,200,0.2); border-radius: 12px; padding: 16px; margin: 14px 0; }
  .info-box p { font-size: 13px; color: var(--accent3); }

  /* BADGES */
  .badge { font-size: 10px; font-family: var(--mono); padding: 3px 8px; border-radius: 100px; display: inline-flex; align-items: center; gap: 4px; }
  .badge-purple { background: rgba(124,106,247,0.15); color: var(--accent); border: 1px solid rgba(124,106,247,0.3); }
  .badge-pink { background: rgba(247,106,183,0.15); color: var(--accent2); border: 1px solid rgba(247,106,183,0.3); }
  .badge-green { background: rgba(106,247,200,0.15); color: var(--accent3); border: 1px solid rgba(106,247,200,0.3); }

  /* STAR */
  .star-score { font-family: var(--mono); font-size: 28px; font-weight: 700; }

  /* RESPONSIVE */
  @media (max-width: 600px) { .choice-grid { grid-template-columns: 1fr; } .platform-grid { grid-template-columns: repeat(2, 1fr); } }

  .section-header { margin-bottom: 24px; }
  .section-header .step-indicator { font-size: 11px; font-family: var(--mono); color: var(--accent2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; display: block; }

  /* SELECTED COUNTER */
  .counter-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(124,106,247,0.12); border: 1px solid rgba(124,106,247,0.3); border-radius: 100px; padding: 4px 12px; font-size: 12px; font-family: var(--mono); color: var(--accent); }

  /* CONSEQUENCE */
  .consequence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  @media (max-width: 500px) { .consequence-grid { grid-template-columns: 1fr; } }
  .consequence-opt { background: var(--surface2); border: 1.5px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; }
  .consequence-opt:hover { border-color: var(--accent); }
  .consequence-opt h3 { font-size: 14px; color: var(--text); margin-bottom: 4px; }
  .consequence-opt p { font-size: 12px; }

  .reveal-box { background: var(--surface2); border-radius: 12px; padding: 20px; margin-top: 16px; border-left: 3px solid var(--accent2); }
  .reveal-box h3 { color: var(--accent2); margin-bottom: 8px; }
  .reveal-box p { font-size: 14px; color: var(--text); line-height: 1.7; }
</style>
</head>

    { label: "Write a calm, evidence-backed reply", outcome: "You respond once, clearly and calmly. New people discover you and see you handle pressure well. Your audience grows.", score: 1 },
  ]},
  { title: "🎙️ A Podcast with 50K Monthly Listeners Invites You", desc: "A well-aligned podcast wants you as a guest. Recording is in 10 days. It's your niche audience, but you've never been on a podcast before.", options: [
    { label: "Decline—not ready", outcome: "You'll never feel ready. Declining low-stakes opportunities means you never get to the high-stakes ones. Stay stuck.", score: 0.1 },
    { label: "Accept and over-prepare", outcome: "You prepare 5 key talking points, research the host, and record. The episode is good. New leads come in for 6+ months.", score: 1 },
    { label: "Accept and wing it", outcome: "Your energy is good but your message is scattered. Some listeners still reach out. Decent outcome, could've been better.", score: 0.6 },
  ]},
  { title: "📋 Someone Copies Your Content Nearly Word-for-Word", desc: "A newer creator in your niche has posted something almost identical to your original framework, without credit. Their post is performing well.", options: [
    { label: "Publicly shame them", outcome: "You look bitter and it gives them more attention. Not worth it unless they monetized it directly.", score: 0.2 },
    { label: "Send a private DM asking for credit", outcome: "Professional and effective. Most people comply. Some even become collaborators after.", score: 1 },
    { label: "Post your original with a 'here's the original' caption", outcome: "Assertive without being aggressive. Your audience rallies, and the comparison clarifies your credibility as the source.", score: 0.9 },
  ]},
];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function ProgressBar({ step, total }) {
  const steps = Array.from({length: total}, (_, i) => i);
  const labels = ["Welcome","Business","Audience","Platforms","Pillars","Roadmap","Event","Report"];
  return (
    <div className="progress-bar">
      {steps.map(i => (
        <div key={i} className={`progress-step ${i < step ? 'done' : i === step ? 'active' : ''}`} />
      ))}
      <span className="progress-label">{labels[step] || ""}</span>
    </div>
  );
}

function ClaudePromptCard({ title, prompt, why }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    navigator.clipboard?.writeText(prompt).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };
  return (
    <div className="prompt-card fade-in">
      <div className="prompt-label">🤖 How to ask Claude — Prompt Engineering</div>
      <h3 style={{color:'var(--text)', marginBottom:8}}>{title}</h3>
      <p style={{marginBottom:12}}>{why}</p>
      <div className="prompt-box">{prompt}</div>
      <button className="btn btn-outline" style={{fontSize:13,padding:'8px 16px'}} onClick={copy}>
        {copied ? "✓ Copied!" : "📋 Copy prompt"}
      </button>
    </div>
  );
}

function InfoBox({children}) {
  return <div className="info-box"><p>{children}</p></div>;
}

// 3. PLATFORM SELECTION
function PlatformScreen({ brand, isPersonal, insights, onNext }) {
  const [selected, setSelected] = useState([]);

  const toggle = (id) => {
    setSelected(prev => prev.includes(id) ? prev.filter(x=>x!==id) : prev.length < 3 ? [...prev, id] : prev);
  };

  const getFit = (p) => {
    if (isPersonal) {
      if (p.personalWeight === 'high') return 'high';
      if (p.personalWeight === 'medium') return 'med';
      return 'low';
    }
    const biz = brand.biz;
    if (!biz) return 'med';
    if (p.id === 'pinterest' && biz.industry.toLowerCase().includes('skin')) return 'high';
    if (p.id === 'instagram' && ['skin','tea','pet','fitness','cocktail'].some(k => biz.industry.toLowerCase().includes(k))) return 'high';
    if (p.id === 'tiktok' && biz.budget !== 'Bootstrap ($500/mo)') return 'high';
    if (p.id === 'linkedin' && ['cowork','skill','course'].some(k => biz.industry.toLowerCase().includes(k))) return 'high';
    if (p.id === 'youtube') return 'med';
    if (p.id === 'newsletter') return 'high';
    return 'med';
  };

  const fitLabel = { high: '⬆ Strong fit', med: '→ Moderate fit', low: '⬇ Lower fit' };

  return (
    <div className="fade-in">
      <div className="section-header">
        <span className="step-indicator">Step 3 of 7</span>
        <h2>Choose Your Platforms</h2>
        <p>The biggest mistake beginners make: trying to be everywhere at once. Great marketers pick 2-3 platforms and dominate them. Choose wisely—based on where your audience actually lives, not where you personally prefer to scroll.</p>
      </div>

      <InfoBox>💡 <strong>Strategist rule:</strong> The best platform isn't the most popular one—it's where your specific audience is AND where your content type shines. Select exactly 3.</InfoBox>

      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', margin:'16px 0 8px'}}>
        <span className="label" style={{margin:0}}>Available Channels</span>
        <span className="counter-chip">{selected.length} / 3 selected</span>
      </div>

      <div className="platform-grid">
        {ALL_PLATFORMS.map(p => {
          const fit = getFit(p);
          const isSelected = selected.includes(p.id);
          const maxed = !isSelected && selected.length >= 3;
          return (
            <div key={p.id}
              className={`platform-card ${isSelected?'selected':''} ${!isSelected && fit==='low' && !maxed ? 'not-recommended' : ''}`}
              onClick={() => !maxed && toggle(p.id)}
              style={{cursor: maxed ? 'not-allowed' : 'pointer', opacity: maxed && !isSelected ? 0.4 : 1}}
            >
              <div className="plat-icon">{p.icon}</div>
              <h3>{p.name}</h3>
              <span className={`fit-badge ${fit==='high'?'fit-high':fit==='med'?'fit-med':'fit-low'}`}>{fitLabel[fit]}</span>
              <p style={{fontSize:11,marginTop:6,lineHeight:1.5}}>{p.why}</p>
              {fit === 'low' && <p style={{fontSize:10,color:'#ff6464',marginTop:4}}>{p.notFor}</p>}
            </div>
          );
        })}
      </div>

      {selected.length > 0 && (
        <div className="card fade-in" style={{marginTop:16}}>
          <span className="label">Your Platform Strategy</span>
          {selected.map(id => {
            const p = ALL_PLATFORMS.find(x=>x.id===id);
            return (
              <div key={id} style={{marginBottom:12}}>
                <h3>{p.icon} {p.name}</h3>
                <p style={{fontSize:13}}>{p.why}</p>
              </div>
            );
          })}
        </div>
      )}

      <button className="btn btn-primary" style={{marginTop:16}} disabled={selected.length !== 3}
        onClick={() => onNext(selected)}>
        Lock In My Platforms →
      </button>

      <ClaudePromptCard
        title={isPersonal ? "Build a platform strategy for your personal brand" : "Validate your platform choices"}
        why="Notice how this prompt asks for tradeoffs, not just recommendations. Asking for pros AND cons forces the AI to think critically, not just agree with you."
        prompt={isPersonal
          ? `I'm building a personal brand as a ${brand.niche || "[your niche]"}. My ideal follower is ${insights?.audience || "[audience]"}.\n\nI'm considering: ${selected.length > 0 ? selected.join(', ') : 'LinkedIn, Newsletter, and YouTube'}.\n\nFor each platform:\n1. Is this right for my niche and audience?\n2. What content format works best here?\n3. What's the realistic time investment per week?\n4. What's the one mistake I should avoid on this platform?`
          : `I'm choosing marketing platforms for ${brand.biz?.name || brand.name}, targeting: ${insights?.audience || "[audience]"}.\n\nI've selected: ${selected.join(', ')}.\n\nFor each platform:\n1. Is this a strong fit for this specific audience?\n2. What content format performs best here for this category?\n3. What competitor is doing this platform best right now?\n4. What would make us stand out vs. them?`}
      />
    </div>
  );
}

      why: "Marketing is not broadcasting—it's conversation. Week 3 prioritizes two-way engagement over more publishing.",
      goals: ["Respond to every comment within 4 hours", "Partner with 2 complementary brands or creators", "Run a question or poll to source content ideas"],
      focus: p2?.label || "Community",
      emoji: "🤝",
    },
    {
      week: "Week 4",
      theme: "Measure, Learn & Optimize",
      why: "Your first month of data is marketing gold. Patterns in what worked tell you more than any trend report.",
      goals: ["Identify top 3 performing content pieces", "Adjust pillars based on audience response", "Set OKRs for Month 2 based on learnings"],
      focus: p3?.label || "Optimization",
      emoji: "📊",
    },
  ];

  return (
    <div className="fade-in">
      <div className="section-header">
        <span className="step-indicator">Step 5 of 7</span>
        <h2>Your 30-Day Content Roadmap</h2>
        <p>A roadmap is different from a content calendar. Instead of planning individual posts, we plan themes, goals, and strategic focus for each week. This gives you direction without rigidity.</p>
      </div>

      <InfoBox>💡 <strong>Strategist insight:</strong> Week 1 is always about foundation, not volume. Marketers who rush to post before understanding their audience waste months creating content nobody cares about.</InfoBox>

      <div style={{marginTop:20}}>
        {weeks.map((w, i) => (
          <div key={i} className="roadmap-week fade-in" style={{animationDelay:`${i*0.1}s`}}>
            <h3>{w.week}</h3>
            <div className="week-theme">{w.emoji} {w.theme}</div>
            <p style={{marginBottom:10, fontSize:13}}>{w.why}</p>
            <div className="goal-tags">
              {w.goals.map((g, j) => <span key={j} className="tag">✓ {g}</span>)}
              <span className="tag" style={{background:'rgba(124,106,247,0.1)', color:'var(--accent)', borderColor:'rgba(124,106,247,0.3)'}}>📌 {w.focus}</span>
            </div>
          </div>
        ))}
      </div>

      <div className="card" style={{marginTop:20}}>
        <span className="label">Why Weekly Goals, Not Daily Posts?</span>
        <p>Content calendars filled with daily posts create busywork. When you focus on weekly goals, you make decisions based on what's working—not just filling a slot. Real strategists plan direction, then adapt execution based on feedback.</p>
      </div>

      <button className="btn btn-primary" style={{marginTop:20}} onClick={onNext}>
        Bring On the Unexpected →
      </button>

      <ClaudePromptCard
        title={isPersonal ? "Build a weekly content system for your personal brand" : "Turn this roadmap into a content calendar"}
        why="The best prompts give Claude a role, a constraint, and ask for output in a specific format. Notice the 'no more than X' constraint—it forces prioritization."
        prompt={isPersonal
          ? `I'm building a personal brand in [your niche]. My 3 content pillars are: ${chosenPillars.map(p=>p.label).join(', ')}.\nI'm active on: ${platforms.join(', ')}.\n\nFor each of the next 4 weeks, give me:\n1. A strategic theme for the week\n2. 3 specific content ideas (format + topic)\n3. One engagement action (comment, DM, collaborate)\n4. One metric to check at the end of the week\n\nKeep it realistic for someone posting 3x per week, no more.`
          : `I'm creating a Month 1 content calendar for ${brand.biz?.name || brand.name}.\nContent pillars: ${chosenPillars.map(p=>p.label).join(', ')}\nPlatforms: ${platforms.join(', ')}\nTarget audience: ${brand.biz?.audience || "[audience]"}\n\nFor each of the 4 weeks:\n1. What's the strategic goal this week?\n2. Give me 3 content ideas per platform\n3. Suggest one community-building action\n4. What's the one question I'm trying to answer with this week's content?\n\nMax 3 posts per week per platform.`}
      />
    </div>
  );
}

// 6. UNEXPECTED EVENT
function EventScreen({ isPersonal, onNext }) {
  const events = isPersonal ? PERSONAL_EVENTS : BUSINESS_EVENTS;
  const [event] = useState(() => pick(events));
  const [chosen, setChosen] = useState(null);
  const [revealed, setRevealed] = useState(false);

  const handleChoose = (opt) => {
    setChosen(opt);
    setTimeout(() => setRevealed(true), 300);
  };

  return (
    <div className="fade-in">
      <div className="section-header">
        <span className="step-indicator">Step 6 of 7</span>
        <h2>⚡ The Unexpected Happens</h2>
        <p>Real marketing never goes exactly to plan. The best strategists aren't the ones with the perfect plan—they're the ones who respond best when the plan breaks. Here's your challenge:</p>
      </div>

      <div className="event-card">
        <span className="badge badge-pink">⚡ LIVE SCENARIO</span>
        <div className="event-title">{event.title}</div>
        <p style={{fontSize:15, color:'var(--text)', lineHeight:1.7}}>{event.desc}</p>
      </div>

      {!chosen && (
        <>
          <p style={{marginTop:20, marginBottom:12}}>What do you do? Choose carefully—each response has real consequences:</p>
          <div className="consequence-grid">
            {event.options.map((opt, i) => (
              <div key={i} className="consequence-opt" onClick={() => handleChoose(opt)}>
                <h3>{opt.label}</h3>
              </div>
            ))}
          </div>
        </>
      )}

      {chosen && (
        <div className="reveal-box fade-in">
          <h3>You chose: "{chosen.label}"</h3>
          <p style={{margin:'12px 0'}}>{chosen.outcome}</p>
          <div style={{display:'flex', alignItems:'center', gap:12, marginTop:16}}>
            <span style={{color:'var(--muted)', fontSize:13}}>Strategic score:</span>
            <div style={{flex:1}}>
              <div className="score-bar"><div className="score-fill" style={{width:`${chosen.score * 100}%`}} /></div>
            </div>
            <span className="star-score" style={{color: chosen.score >= 0.8 ? 'var(--accent3)' : chosen.score >= 0.5 ? 'var(--warn)' : '#ff6464'}}>
              {chosen.score >= 0.8 ? '★★★' : chosen.score >= 0.5 ? '★★' : '★'}
            </span>
          </div>
          {chosen.score < 0.7 && (
            <div className="info-box" style={{marginTop:14, background:'rgba(255,100,100,0.06)', borderColor:'rgba(255,100,100,0.2)'}}>
              <p style={{color:'#ff9090'}}>💡 Even experienced marketers make this call wrong. The key lesson: {chosen.score < 0.3 ? "Transparency and speed always beat avoidance in a crisis." : "Good instinct, but the optimal move was more proactive."}</p>
            </div>
          )}
        </div>
      )}

      <ClaudePromptCard
        title={isPersonal ? "Ask Claude how to handle personal brand crises" : "Ask Claude to scenario-plan marketing surprises"}
        why="Scenario prompting—giving Claude a specific situation and asking 'what would a pro do?'—is one of the most powerful uses of AI for strategic thinking."
        prompt={isPersonal
          ? `I'm a personal brand creator in [your niche]. This just happened to me:\n\n"${event.desc}"\n\nI'm considering: "${chosen?.label || '[your choice]'}"\n\nAnalyze this choice:\n1. Is this the right move? Why or why not?\n2. What would the top 1% of personal brand builders do here?\n3. What's the long-term reputation impact?\n4. Give me exact messaging / scripts I could use right now.`
          : `I'm the marketing strategist for ${event.title}. This just happened:\n\n"${event.desc}"\n\nMy response was: "${chosen?.label || '[your choice]'}"\n\nGive me:\n1. An honest assessment of this decision\n2. What the ideal strategic response would have been\n3. A crisis communication template I can adapt\n4. How to prevent this situation from happening again`}
      />

      <button className="btn btn-primary" style={{marginTop:20}} disabled={!chosen}
        onClick={() => onNext(chosen)}>
        See My Growth Report →
      </button>
    </div>
  );
}

// 7. FINAL REPORT
function ReportScreen({ brand, isPersonal, insights, platforms, pillars, eventChoice, onRestart }) {
  const pillarData = isPersonal ? PERSONAL_PILLARS : BUSINESS_PILLARS;
  const chosenPillars = pillars.map(id => pillarData.find(p=>p.id===id)).filter(Boolean);
  const score = Math.round((0.7 + (eventChoice?.score || 0.5) * 0.3) * 100);

  const lessons = isPersonal ? [
    { title: "Authenticity is your moat", desc: "Corporations can copy your content, but they can't copy you. Your real story, opinions, and personality are the only thing that's truly defensible as a personal brand." },
    { title: "Consistency beats virality", desc: "Going viral once means nothing without a consistent content system underneath it. The algorithm rewards regularity. Your audience rewards reliability." },
    { title: "Niche clarity is counterintuitive growth", desc: "The narrower your focus, the faster you grow. Speaking to everyone means resonating with no one. Own a specific idea before expanding." },
  ] : [
    { title: "Strategy before tactics", desc: "Posting 3x a week without knowing who you're talking to is just noise. Every tactical decision—channel, format, posting time—should flow from a deep understanding of your audience." },
    { title: "Marketing is a system, not a campaign", desc: "One viral post doesn't build a brand. The most successful marketers build content engines: pillars → platforms → calendar → optimize → repeat." },
    { title: "The best metric is business impact", desc: "Likes and followers are vanity metrics. The question is always: is this activity driving awareness, trust, and conversion? If you can't connect content to outcomes, rethink the strategy." },
  ];

  const audience_score = insights?.audience?.length > 30 ? 85 : 65;
  const platform_score = platforms.length === 3 ? 90 : 70;
  const content_score = chosenPillars.length === 3 ? 88 : 70;
  const growth_score = Math.round((audience_score + platform_score + content_score) / 3);

  return (
    <div className="fade-in">
      <div className="section-header">
        <span className="step-indicator">Step 7 of 7 — Complete</span>
        <h2>Your Growth Report</h2>
      </div>

      <div className="card glow accent-border" style={{textAlign:'center', marginBottom:24}}>
        <span className="label">Overall Strategic Score</span>
        <div style={{fontSize:72, fontWeight:700, fontFamily:'var(--mono)', color:'var(--accent)', lineHeight:1}}>{score}</div>
        <div style={{color:'var(--muted)', fontSize:13, marginTop:8}}>out of 100 — based on audience clarity, platform fit, pillar coherence & event response</div>
      </div>

      <div className="report-grid">
        {[
          { title: "Audience Understanding", val: audience_score, desc: insights?.audience || "You defined your audience clearly." },
          { title: "Platform Strategy", val: platform_score, desc: `You chose ${platforms.join(', ')} — a focused approach to reach your audience.` },
          { title: "Content Strategy", val: content_score, desc: `Your pillars (${chosenPillars.map(p=>p.label).join(', ')}) create a balanced content mix.` },
          { title: "Growth Potential", val: growth_score, desc: "With consistent execution of this strategy, sustainable growth is achievable." },
        ].map(item => (
          <div key={item.title} className="report-item">
            <h3>{item.title}</h3>
            <div className="score-bar" style={{margin:'6px 0'}}><div className="score-fill" style={{width:`${item.val}%`}} /></div>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
              <span style={{fontSize:11, color:'var(--muted)', fontFamily:'var(--mono)'}}>{item.val}/100</span>
            </div>
            <p style={{fontSize:13}}>{item.desc}</p>
          </div>
        ))}
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, margin:'16px 0'}}>
        <div className="card" style={{background:'rgba(106,247,200,0.05)', borderColor:'rgba(106,247,200,0.2)'}}>
          <span className="label" style={{color:'var(--accent3)'}}>🏆 Best Decision</span>
          <p style={{color:'var(--text)', fontSize:14, lineHeight:1.7}}>Selecting focused platforms ({platforms.slice(0,2).join(' + ')}) instead of spreading thin across every channel. Depth beats breadth, especially early on.</p>
        </div>
        <div className="card" style={{background:'rgba(255,100,100,0.05)', borderColor:'rgba(255,100,100,0.2)'}}>
          <span className="label" style={{color:'#ff9090'}}>⚠️ Watch Out For</span>
          <p style={{color:'var(--text)', fontSize:14, lineHeight:1.7}}>
            {eventChoice?.score < 0.7
              ? `The event response scored ${Math.round((eventChoice?.score||0.5)*100)}%. In real marketing, crisis decisions happen fast. Build scenario plans before you need them.`
              : "Staying consistent when early results are slow. Most brands quit during the 'trough of low expectations'—weeks 3-6 of execution."}
          </p>
        </div>
      </div>

      <div className="card" style={{marginBottom:20}}>
        <span className="label">3 Marketing Lessons You Earned Today</span>
        <div style={{display:'flex', flexDirection:'column', gap:14, marginTop:16}}>
          {lessons.map((l, i) => (
            <div key={i} className="lesson-card">
              <div className="lesson-num">0{i+1}</div>
              <div>
                <h3 style={{marginBottom:4, color:'var(--text)'}}>{l.title}</h3>
                <p style={{fontSize:13}}>{l.desc}</p>
              </div>
            </div>
          ))}
        </div>
      </div>

      <ClaudePromptCard
        title={isPersonal ? "Build a personal brand execution plan" : "Build a 90-day marketing execution plan"}
        why="Now that you have a strategy, use Claude to turn it into an actionable plan. The key here is giving Claude everything from this simulation as context—specific beats generic every time."
        prompt={isPersonal
          ? `I've just completed a personal brand strategy exercise. Here's my summary:\n\nName & Niche: ${brand.name || "[name]"} — ${brand.niche || "[niche]"}\nIdeal follower: ${insights?.audience || "[audience]"}\nPlatforms: ${platforms.join(', ')}\nContent pillars: ${chosenPillars.map(p=>p.label).join(', ')}\n\nNow build me:\n1. A 90-day personal brand execution roadmap\n2. Weekly non-negotiable habits (minimum viable consistency)\n3. 3 lead magnets I could create to grow my email list\n4. How I'll know by Day 90 if this strategy is working (specific metrics)`
          : `I've completed a marketing strategy exercise for ${brand.biz?.name || brand.name}.\n\nKey facts:\n- Industry: ${brand.biz?.industry || "our industry"}\n- Target audience: ${insights?.audience || brand.biz?.audience || "our audience"}\n- Platforms: ${platforms.join(', ')}\n- Content pillars: ${chosenPillars.map(p=>p.label).join(', ')}\n- Challenge: ${brand.biz?.challenge || "growing the brand"}\n\nNow give me:\n1. A 90-day marketing execution plan with monthly milestones\n2. KPIs and how to track them (tools + cadence)\n3. Budget allocation recommendations\n4. The one thing I should do in Week 1 that will have the highest leverage`}
      />

      <hr className="divider" />
      <div style={{textAlign:'center', marginTop:24}}>
        <p style={{marginBottom:20}}>Marketing is a muscle—it grows with practice. Run this simulation again with a different brand to keep sharpening your strategic thinking.</p>
        <button className="btn btn-primary" style={{fontSize:16, padding:'14px 32px'}} onClick={onRestart}>
          🎲 Try Another Brand
        </button>
      </div>
    </div>
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────

function App() {
  const [step, setStep] = useState(0);
  const [brand, setBrand] = useState(null);
  const [insights, setInsights] = useState(null);
  const [platforms, setPlatforms] = useState([]);
  const [pillars, setPillars] = useState([]);
  const [eventChoice, setEventChoice] = useState(null);

  const isPersonal = brand?.mode === 'personal';
  const TOTAL_STEPS = 8;

  const restart = () => {
    setStep(0); setBrand(null); setInsights(null);
    setPlatforms([]); setPillars([]); setEventChoice(null);
    window.scrollTo(0,0);
  };

  const goNext = () => { setStep(s => s+1); setTimeout(() => window.scrollTo({top:0, behavior:'smooth'}), 50); };

  return (
    <div className="app">
      {step > 0 && step < 8 && <ProgressBar step={step} total={TOTAL_STEPS} />}

      {step === 0 && <WelcomeScreen onStart={goNext} />}
      {step === 1 && (
        <ChooseModeScreen onChoose={(b) => { setBrand(b); goNext(); }} />
      )}
      {step === 2 && brand && (
        <BrandUnderstandScreen brand={brand} isPersonal={isPersonal}
          onNext={(ins) => { setInsights(ins); goNext(); }} />
      )}
      {step === 3 && brand && (
        <PlatformScreen brand={brand} isPersonal={isPersonal} insights={insights}
          onNext={(p) => { setPlatforms(p); goNext(); }} />
      )}
      {step === 4 && (
        <PillarsScreen brand={brand} isPersonal={isPersonal}
          onNext={(p) => { setPillars(p); goNext(); }} />
      )}
      {step === 5 && (
        <RoadmapScreen brand={brand} isPersonal={isPersonal}
          platforms={platforms} pillars={pillars} onNext={goNext} />
      )}
      {step === 6 && (
        <EventScreen isPersonal={isPersonal}
          onNext={(choice) => { setEventChoice(choice); goNext(); }} />
      )}
      {step === 7 && (
        <ReportScreen brand={brand} isPersonal={isPersonal}
          insights={insights} platforms={platforms} pillars={pillars}
          eventChoice={eventChoice} onRestart={restart} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
